name: Gerar APK do Compensa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar componentes do Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar o APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk Compensa.apk

      - name: Guardar o APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: Compensa-APK
          path: Compensa.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Compensa (última versão)
          files: Compensa.apk
