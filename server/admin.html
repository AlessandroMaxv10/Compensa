<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compensa — Painel</title>
<style>
  :root{
    --g:#12A150; --g2:#3DF08A; --gd:#0B8A43; --r:#E0433B; --amber:#E8A13B;
    --bg:#07130D; --bg2:#0E2117; --card:#122820; --tx:#EAF5EF; --mu:#9FB6AA; --line:#1E3A2D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
  a{color:var(--g2)}
  header{position:sticky;top:0;z-index:20;background:rgba(7,19,13,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:10px;max-width:1000px;margin:0 auto;padding:14px 18px}
  .logo{font-weight:800;font-size:19px}.nav .sp{flex:1}
  .nav button{background:#1b2f26;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
  main{max-width:1000px;margin:0 auto;padding:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
  h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat b{display:block;font-size:28px;line-height:1.1}.stat span{color:var(--mu);font-size:13px}
  .stat.hot{background:linear-gradient(135deg,rgba(18,161,80,.25),rgba(61,240,138,.08));border-color:var(--g)}
  .stat.hot b{color:var(--g2)}
  label{display:block;font-size:13px;color:var(--mu);margin:10px 0 5px}
  input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#0a1711;color:#fff;font-size:15px}
  input:focus,select:focus{outline:none;border-color:var(--g)}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .btn{background:var(--g);color:#fff;border:0;border-radius:11px;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px}
  .btn.sec{background:#1b2f26;color:var(--tx);border:1px solid var(--line)}
  .err{color:#ff8a82;font-weight:700;margin-top:8px;min-height:20px}.okc{color:var(--g2)}
  .muted{color:var(--mu);font-size:13px}
  /* usuários */
  .u{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
  .u .top{display:flex;align-items:center;gap:10px}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .dot.on{background:var(--g2);box-shadow:0 0 10px var(--g2)}
  .dot.off{background:#C7443C}
  .u .name{font-weight:700;font-size:16px;flex:1}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
  .ok{background:#15351f;color:var(--g2)} .no{background:#3a1a18;color:#ff8a82}
  .wait{background:#3a2f12;color:var(--amber)} .req{background:#152a4a;color:#7fb0ff}
  .u .sub{color:var(--mu);font-size:13px;margin-top:6px}
  .acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .acts button{background:#1b2f26;color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
  .acts button.go{background:var(--g);color:#fff;border-color:var(--g)}
  .acts button.del{background:#2a1512;color:#ff8a82;border-color:#512a26}
  #login{max-width:380px;margin:50px auto}
  .dlbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .dlbar a{display:inline-block;background:var(--g);color:#fff;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:11px}
  .dlbar a.sec{background:#1b2f26;color:var(--tx);border:1px solid var(--line)}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">🚗💲 Compensa <span class="muted" style="font-weight:500">· Painel</span></div><div class="sp"></div><button id="sair" hidden>Sair</button></div></header>

<main>
  <div id="login" class="card">
    <h2>Entrar no painel</h2>
    <label>Usuário</label><input id="lu" autocomplete="username">
    <label>Senha</label><input id="lp" type="password" autocomplete="current-password">
    <button class="btn" id="entrar" style="width:100%">Entrar</button>
    <div class="err" id="lerr"></div>
  </div>

  <div id="app" hidden>
    <div class="card">
      <h2>📊 Visão geral <span class="muted" id="auto" style="font-weight:500;margin-left:auto;font-size:12px"></span></h2>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <h2>📲 O aplicativo</h2>
      <div class="dlbar">
        <a href="/download">⬇️ Baixar o app (APK)</a>
        <a class="sec" href="/" target="_blank">🌐 Ver o site público</a>
      </div>
      <p class="muted" style="margin-top:10px">Mande o site <b id="siteurl"></b> para os motoristas se cadastrarem.</p>
    </div>

    <div class="card">
      <h2>➕ Liberar acesso para um motorista</h2>
      <div class="row">
        <div><label>Nome completo</label><input id="nn" placeholder="João Pedro da Silva"></div>
        <div><label>CPF</label><input id="nc" inputmode="numeric" placeholder="000.000.000-00" maxlength="14"></div>
        <div><label>Dias de acesso (0 = sem limite)</label><input id="nd" inputmode="numeric" value="3"></div>
      </div>
      <button class="btn" id="criar">Liberar acesso</button>
      <div class="err" id="cerr"></div>
    </div>

    <div class="card">
      <h2>👥 Motoristas</h2>
      <div id="users"></div>
    </div>

    <div class="card">
      <h2>🔒 Minha senha</h2>
      <div class="row">
        <div><label>Senha atual</label><input id="po" type="password"></div>
        <div><label>Senha nova</label><input id="pn" type="password"></div>
      </div>
      <button class="btn sec" id="trocar">Trocar minha senha</button>
      <div class="err" id="perr"></div>
    </div>
  </div>
</main>

<script>
let token=null; try{token=localStorage.getItem('compensa_token')}catch(e){}
let timer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleDateString('pt-BR'):'—';
function hora(t){ if(!t)return 'nunca'; const m=Math.floor((Date.now()-t)/60000);
  if(m<1)return 'agora'; if(m<60)return 'há '+m+' min'; const h=Math.floor(m/60); if(h<24)return 'há '+h+'h'; return fmt(t); }

async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&url!=='/api/login'){logout();throw new Error('Sessão expirada')}
  if(!r.ok)throw new Error(j.error||'Erro'); return j;
}
function logout(){token=null;try{localStorage.removeItem('compensa_token')}catch(e){}clearInterval(timer);show()}
function show(){$('login').hidden=!!token;$('app').hidden=!token;$('sair').hidden=!token;
  if(token){$('siteurl').textContent=location.origin;load();clearInterval(timer);timer=setInterval(load,30000);$('auto').textContent='atualiza sozinho'}}

$('entrar').onclick=async()=>{$('lerr').textContent='';
  try{const j=await api('POST','/api/login',{user:$('lu').value,pass:$('lp').value});
    if(j.role!=='admin')throw new Error('Esta conta não é de administrador');
    token=j.token;try{localStorage.setItem('compensa_token',token)}catch(e){}show();
  }catch(e){$('lerr').textContent=e.message}};
$('lp').onkeydown=e=>{if(e.key==='Enter')$('entrar').click()};
$('sair').onclick=logout;

async function load(){
  try{
    const s=await api('GET','/api/admin/stats');
    $('stats').innerHTML=`
      <div class="stat hot"><b>${s.onlineNow||0}</b><span>🟢 online agora</span></div>
      <div class="stat"><b>${s.drivers||0}</b><span>motoristas</span></div>
      <div class="stat"><b>${s.installed||0}</b><span>instalaram o app</span></div>
      <div class="stat"><b>${s.using24h||0}</b><span>usaram hoje</span></div>
      <div class="stat"><b>${s.using7d||0}</b><span>usaram na semana</span></div>
      <div class="stat"><b>${s.requests||0}</b><span>pedindo acesso</span></div>
      <div class="stat"><b>${s.trials||0}</b><span>🎁 em teste (3 dias)</span></div>
      <div class="stat"><b>${s.trialsEnded||0}</b><span>testes acabados</span></div>
      <div class="stat"><b>${s.samples||0}</b><span>avaliações (IA)</span></div>`;
    const us=await api('GET','/api/admin/users');
    window._u=us;
    us.sort((a,b)=>(b.requested-a.requested)||(b.online-a.online)||((b.lastSeen||0)-(a.lastSeen||0)));
    $('users').innerHTML=us.map(u=>{
      const venc=u.validUntil&&u.validUntil<Date.now();
      const st=u.requested?'<span class="pill req">Pediu acesso</span>'
        :!u.active?'<span class="pill no">Bloqueada</span>'
        :u.pending?(u.inviteExpired?'<span class="pill no">Convite vencido</span>':'<span class="pill wait">Aguardando 1º acesso</span>')
        :u.trialEnded?'<span class="pill no">🎁 Teste acabou</span>'
        :venc?'<span class="pill no">Vencida</span>'
        :u.trial?'<span class="pill wait">🎁 Em teste</span>'
        :'<span class="pill ok">Ativa</span>';
      const reset=u.resetRequested?' <span class="pill req">🔑 troca de senha</span>':'';
      return `<div class="u">
        <div class="top"><span class="dot ${u.online?'on':'off'}"></span>
          <span class="name">${esc(u.name)}${u.role==='admin'?' 👑':''}</span>${st}${reset}</div>
        <div class="sub">${u.user?'usuário: '+esc(u.user):'sem usuário ainda'}${u.cpf?' · CPF '+esc(u.cpf):''}
          · ${u.online?'🟢 online':'⚪ visto '+hora(u.lastSeen)}
          · validade: ${u.validUntil?fmt(u.validUntil):'sem limite'}
          · aparelhos: ${u.devices}/${u.maxDevices}</div>
        <div class="acts">
          ${u.requested?`<button class="go" onclick="act('${u.id}','aprovar')">✅ Liberar</button>`:''}
          <button onclick="act('${u.id}','${u.active?'bloquear':'liberar'}')">${u.active?'Bloquear':'Liberar'}</button>
          <button onclick="act('${u.id}','dias')">Dias de acesso</button>
          <button onclick="act('${u.id}','mais30')">+30 dias</button>
          <button onclick="act('${u.id}','apar')">${u.maxDevices===2?'1 aparelho':'2 aparelhos'}</button>
          ${u.devices>0?`<button onclick="act('${u.id}','desvincular')">Desvincular</button>`:''}
          ${!u.pending&&u.cpf?`<button onclick="act('${u.id}','refazer')">Refazer acesso</button>`:''}
          <button class="del" onclick="act('${u.id}','excluir')">Excluir</button>
        </div></div>`;
    }).join('')||'<p class="muted">Nenhum motorista ainda.</p>';
  }catch(e){}
}

async function act(id,what){
  const u=window._u.find(x=>x.id===id);
  try{
    if(what==='aprovar'){await api('PATCH','/api/admin/users/'+id,{approve:true});}
    else if(what==='bloquear'||what==='liberar'){await api('PATCH','/api/admin/users/'+id,{active:what==='liberar'});}
    else if(what==='mais30'){await api('PATCH','/api/admin/users/'+id,{addDays:30});}
    else if(what==='dias'){const d=prompt('Quantos dias de acesso para '+u.name+'? (0 = sem limite)','30');if(d===null)return;await api('PATCH','/api/admin/users/'+id,{days:Number(d)});}
    else if(what==='apar'){const novo=u.maxDevices===2?1:2;await api('PATCH','/api/admin/users/'+id,novo===1?{maxDevices:1,unbind:true}:{maxDevices:2});}
    else if(what==='desvincular'){await api('PATCH','/api/admin/users/'+id,{unbind:true});}
    else if(what==='refazer'){if(!confirm('Refazer acesso de '+u.name+'? Ele cria login e senha de novo com nome + CPF.'))return;await api('PATCH','/api/admin/users/'+id,{reset:true});}
    else if(what==='excluir'){if(!confirm('Excluir '+u.name+'? Não dá para desfazer.'))return;await api('DELETE','/api/admin/users/'+id);}
    load();
  }catch(e){alert(e.message)}
}

$('nc').oninput=e=>{let d=e.target.value.replace(/\D/g,'').slice(0,11);
  e.target.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')};
$('criar').onclick=async()=>{$('cerr').textContent='';
  try{const u=await api('POST','/api/admin/users',{name:$('nn').value,cpf:$('nc').value});
    const d=Number($('nd').value);if(d>0)await api('PATCH','/api/admin/users/'+u.id,{days:d});
    $('nn').value=$('nc').value='';$('cerr').className='err okc';$('cerr').textContent='Acesso liberado! Peça para a pessoa abrir o app e fazer o primeiro acesso.';load();
  }catch(e){$('cerr').className='err';$('cerr').textContent=e.message}};
$('trocar').onclick=async()=>{$('perr').textContent='';
  try{await api('POST','/api/password',{old:$('po').value,pass:$('pn').value});
    $('perr').className='err okc';$('perr').textContent='Senha trocada!';$('po').value=$('pn').value='';
  }catch(e){$('perr').className='err';$('perr').textContent=e.message}};
show();
</script>
</body>
</html>
